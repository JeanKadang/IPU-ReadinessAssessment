name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release with a zip of the scripts
# and docs, and a SHA-256 file for the zip and for each script. The tag must
# match the version in the script header; CI must already be green on the
# tagged commit (tags are only made on main after a merge).
on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag against the script version
        run: |
          version="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -oP '^\s*VERSION\s*:\s*\K[0-9]+\.[0-9]+\.[0-9]+' src/Windows-IPU-Readiness-Assessment.ps1)
          collector=$(grep -m1 -oP "^\\\$script:CollectorVersion\s*=\s*'\K[0-9.]+" src/Windows-IPU-Readiness-Assessment.ps1)
          echo "tag=$version header=$header collector=$collector"
          if [ "$version" != "$header" ] || [ "$version" != "$collector" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the script version (header $header, CollectorVersion $collector)."
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version."; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the zip and hashes
        run: |
          name="IPU-ReadinessAssessment-$VERSION"
          mkdir -p "dist/$name/docs"
          cp src/Windows-IPU-Readiness-Assessment.ps1 src/Merge-IPUAssessments.ps1 README.md CHANGELOG.md LICENSE SECURITY.md "dist/$name/"
          cp docs/user-guide.md docs/checks.md docs/result-schema.md docs/result-schema.json "dist/$name/docs/"
          cp -r docs/examples "dist/$name/docs/"
          (cd dist && zip -r -X "$name.zip" "$name")
          (cd dist && cp "$name/Windows-IPU-Readiness-Assessment.ps1" "$name/Merge-IPUAssessments.ps1" . \
            && sha256sum "$name.zip" Windows-IPU-Readiness-Assessment.ps1 Merge-IPUAssessments.ps1 > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > dist/notes.md
          {
            echo
            echo '### Verify the download'
            echo
            echo 'Compare with `SHA256SUMS.txt` (the scripts are not code-signed yet, see #14):'
            echo
            echo '```powershell'
            echo 'Get-FileHash .\Windows-IPU-Readiness-Assessment.ps1 -Algorithm SHA256'
            echo '```'
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> dist/notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/notes.md \
            "dist/IPU-ReadinessAssessment-$VERSION.zip" dist/SHA256SUMS.txt \
            dist/Windows-IPU-Readiness-Assessment.ps1 dist/Merge-IPUAssessments.ps1
