name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run on main, so changes in the runner images (Windows updates,
  # PowerShell, tools) show up even when nobody opens a pull request.
  # A failed scheduled run opens or updates an issue (job "notify").
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Run the notify job without a failure (tests the issue it writes)'
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress,
# so superseded commits do not use Actions minutes (#85).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Tool versions are pinned so a new release cannot change results unnoticed.
# Actions are pinned to commit SHAs; Dependabot proposes updates.
env:
  PESTER_VERSION: 5.7.1
  PSSA_VERSION: 1.23.0

jobs:
  pester:
    # Stable job names: "pester (Windows PowerShell 5.1)" and "pester (PowerShell 7)".
    name: pester (${{ matrix.name }})
    # Images are named, not windows-latest, so a moved label cannot change
    # what a green run means. The unit tests do not depend on the image.
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            shell: powershell
            coverage: false
          - name: PowerShell 7
            shell: pwsh
            coverage: true
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Pester
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if ($PSVersionTable.PSVersion.Major -lt 6) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Pester
        run: |
          if ('${{ matrix.coverage }}' -eq 'true') { ./build/Invoke-CiTests.ps1 -Coverage } else { ./build/Invoke-CiTests.ps1 }

  smoke:
    # Runs the real script end to end on the runner (Pre, then Post against
    # the Pre result) and validates the JSON against docs/result-schema.json.
    # Nothing is uploaded: the reports describe the runner in detail.
    # Every Windows Server image GitHub offers (2025 and 2022; 2019 was
    # retired in 2025), because what the script reads differs per release.
    # Pull requests run windows-2025 only, to save Actions minutes (#85);
    # pushes to main, the weekly schedule and manual runs add windows-2022,
    # so every image is covered before a release.
    # Stable job names: "smoke (<shell>, <image>)".
    name: smoke (${{ matrix.name }}, ${{ matrix.image }})
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-2025"]' || '["windows-2025","windows-2022"]') }}
        name: [Windows PowerShell 5.1, PowerShell 7]
        include:
          - name: Windows PowerShell 5.1
            shell: powershell
          - name: PowerShell 7
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the assessment end to end
        run: ./build/Invoke-SmokeTest.ps1

  lint:
    name: lint (PSScriptAnalyzer)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION -Scope CurrentUser -Force
      - name: Run PSScriptAnalyzer
        run: ./build/Invoke-CiLint.ps1 -FailOn Warning

  notify:
    # Makes a failed scheduled run visible: opens an issue, or comments on the
    # open one, instead of relying on someone reading the Actions tab.
    name: notify (scheduled run failed)
    needs: [pester, smoke, lint]
    if: >-
      always() && (
        (github.event_name == 'schedule' && contains(needs.*.result, 'failure')) ||
        (github.event_name == 'workflow_dispatch' && inputs.test_notification)
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: 'pester=${{ needs.pester.result }}, smoke=${{ needs.smoke.result }}, lint=${{ needs.lint.result }}'
          TEST: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          title='Scheduled CI run failed'
          if [ "$TEST" = 'true' ]; then title='Scheduled CI run failed (notification test)'; fi
          body="The ${GITHUB_EVENT_NAME} CI run on main did not pass: ${RESULTS}.

          Run: ${RUN_URL}

          A change in the runner image (Windows updates, PowerShell, tools) can cause this without a code change. Open the run, fix the cause in a branch, and close this issue with a link to the fix."
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label bug --label testing
          fi
