name: Label pull requests

# pull_request_target runs the workflow file from main with a token that can
# label the pull request. It never checks out or runs code from the pull
# request; actions/labeler only reads the list of changed files and the
# branch name, so this is safe for pull requests from forks too.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
